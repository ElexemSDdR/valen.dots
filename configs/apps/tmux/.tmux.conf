# Change the resurrect keybinds
set -g @resurrect-save 'U'
set -g @resurrect-restore 'R'

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode

# --- INICIALIZAR TPM ---
run '~/.tmux/plugins/tpm/tpm'

setw -g clock-mode-colour green
# Panes configuration
set -g pane-border-style 'fg=black'
set -g pane-active-border-style 'fg=magenta'

# Configuration of hamvocke
# statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=white bg=purple'
set -g status-right ' %Y-%m-%d %H:%M '
set -g status-right-length 20

setw -g window-status-current-style 'fg=magenta bold bg=purple'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=black bg=magenta bold'
